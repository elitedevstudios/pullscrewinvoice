}

// keep select values in sync after re-render
function renderSoft() { render(); syncSelects(); }
function syncSelects() {
  if (!draft) return;
  const c = $("#dClient"); if (c) c.value = draft.clientId;
  const s = $("#dStatus"); if (s) s.value = draft.status;
}

function setIssueDate(v) {
  const wasDefault = draft.dueDate === addDays(draft.issueDate,
    draft.type === "invoice" ? S.settings.paymentTermsDays : S.settings.estimateValidDays);
  draft.issueDate = v;
  if (wasDefault) draft.dueDate = addDays(v,
    draft.type === "invoice" ? S.settings.paymentTermsDays : S.settings.estimateValidDays);
  renderSoft();
}
function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
function addItem() {
  draft.items.push({ id: uid(), desc: "", qtyMilli: 1000, unitCents: 0,
    taxable: draft.taxRateBp > 0 && !!S.settings.taxDefaultOn });
  renderSoft();
  const rows = $$("#itemRows tr");
  const last = rows[rows.length - 1];
  if (last) $("textarea", last).focus();
}
function rmItem(i) {
  draft.items.splice(i, 1);
  if (!draft.items.length) draft.items.push({ id: uid(), desc: "", qtyMilli: 1000,
    unitCents: 0, taxable: draft.taxRateBp > 0 });
  renderSoft();
}
/* Recompute the amount cells and the totals block in place. A full re-render
   here would tear the row out from under whichever input you tabbed into. */
function patchAmounts() {
  if (!draft) return;
  const t = computeDoc(draft);
  $$("#itemRows .amtCell").forEach((cell, i) => {
    cell.textContent = Money.fmt(t.lines[i] || 0, draft.currency);
  });
  const tot = $("#dTotals");
  if (tot) tot.innerHTML = totalsBlock(draft, t, true);
  const sub = $("#pageSub");
  if (sub) sub.textContent = draft.number + (draft.clientId ? " · " + clientName(draft.clientId) : "");
}
function upItem(i, field, val) {
  const it = draft.items[i]; if (!it) return;
  if (field === "desc") { it.desc = val; return; }   // description can't change any total
  if (field === "qty") it.qtyMilli = Qty.parse(val);
  if (field === "unit") it.unitCents = Money.parse(val);
  if (field === "taxable") it.taxable = !!val;
  patchAmounts();
}
function setDiscountType(t) {
  draft.discount = { type: t, value: t === "none" ? 0 : (draft.discount.value || 0) };
  renderSoft();   // the discount input itself changes shape, so redraw
}
function setDiscountValue(v) {
  if (draft.discount.type === "pct") {
    const n = parseFloat(String(v).replace(/[^0-9.]/g, "")) || 0;
    draft.discount.value = Math.round(clamp(n, 0, 100) * 100);
  } else {
    draft.discount.value = Math.max(0, Money.parse(v));
  }
  patchAmounts();
}
function toggleTax(on) {
  draft.taxRateBp = on ? (S.settings.taxRateBp || 1500) : 0;
  if (on) {
    draft.taxLabel = draft.taxLabel || S.settings.taxLabel || "GCT";
    draft.items.forEach((it) => { if (it.taxable === undefined) it.taxable = true; });
    if (!draft.items.some((it) => it.taxable)) draft.items.forEach((it) => { it.taxable = true; });
  }
  renderSoft();
}
function setTaxRate(v) {
  const n = parseFloat(String(v).replace(/[^0-9.]/g, "")) || 0;
  const was = draft.taxRateBp;
  draft.taxRateBp = Math.round(clamp(n, 0, 100) * 100);
  // crossing zero adds or drops the per-line tax column, so redraw then
  if ((was > 0) !== (draft.taxRateBp > 0)) renderSoft(); else patchAmounts();
}
function rmPayment(i) { draft.payments.splice(i, 1); renderSoft(); }

function quickClient() {
  clientDlg();
  const orig = $("#cSave").onclick;
  $("#cSave").onclick = () => {
    const before = S.clients.length;
    orig();
    if (S.clients.length > before && draft) {
      draft.clientId = S.clients[S.clients.length - 1].id;
      renderSoft();
    }
  };
}

function cancelEdit() {
  const d = draft;
  draft = null;
  if (d && d.__new) go(d.type === "invoice" ? "#/invoices" : "#/estimates");
  else go("#/doc/" + (d ? d.id : ""));
}

function saveDraft(navigate) {
  // Amount and qty fields commit on blur. Saving via Cmd+S while still inside
  // one would otherwise drop that edit, so force the commit first.
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (!draft.clientId) { toast("Pick a client first.", "err"); return false; }
  if (!draft.number.trim()) { toast("Give the document a number.", "err"); return false; }
  const dup = S.docs.find((d) => d.id !== draft.id && d.type === draft.type &&
    d.number.trim().toLowerCase() === draft.number.trim().toLowerCase());
  if (dup) { toast("Number " + draft.number + " is already used.", "err"); return false; }

  draft.items = draft.items.filter((it) =>
    (it.desc || "").trim() || it.unitCents || (it.qtyMilli && it.qtyMilli !== 1000));
  if (!draft.items.length) { toast("Add at least one line item.", "err");
    draft.items.push({ id: uid(), desc: "", qtyMilli: 1000, unitCents: 0, taxable: false });
    renderSoft(); return false; }

  draft.updatedAt = new Date().toISOString();
  const isNew = draft.__new === true;
  delete draft.__new;

  if (isNew) {
    S.docs.push(draft);
    if (draft.type === "invoice") S.settings.invoiceNext++;
    else S.settings.estimateNext++;
  } else {
    const i = S.docs.findIndex((d) => d.id === draft.id);
    if (i >= 0) S.docs[i] = draft; else S.docs.push(draft);
  }
  const id = draft.id;
  persist(true);
  toast(isNew ? "Saved" : "Changes saved");
  draft = null;
  if (navigate) go("#/doc/" + id);
  return true;
}

function deleteDoc(id) {
  const d = docById(id) || draft;
  confirmDlg("Delete this " + (d.type || "document") + "?",
    "<b>" + esc(d.number) + "</b> will be permanently removed. This cannot be undone.",
    "Delete", () => {
      S.docs = S.docs.filter((x) => x.id !== id);
      S.docs.forEach((x) => { if (x.convertedToId === id) x.convertedToId = null; });
      draft = null; persist(true);
      go(d.type === "estimate" ? "#/estimates" : "#/invoices");
      toast("Deleted");
    }, true);
}

  $("#pSave").onclick = () => {
    const amt = Money.parse($("#pAmt").value);
    if (amt <= 0) { toast("Amount must be more than zero.", "err"); return; }

      amountCents: amt, method: $("#pMethod").value, note: $("#pRef").value.trim() });
    if (d.status === "draft") d.status = "sent";
    if (!fromEditor) { d.updatedAt = new Date().toISOString(); persist(true); }

  };

/* --------------------------------------------------- estimate → invoice */
function convertDlg(estId) {
  const e = docById(estId);
  if (!e) return;
  const t = computeDoc(e);
  openModal("Convert to invoice",
    '<p style="margin:0 0 16px;color:var(--text-2);line-height:1.55">' +
      "Estimate <b>" + esc(e.number) + "</b> for <b>" + esc(clientName(e.clientId)) +
      "</b> becomes a new invoice. Line items, tax and discount carry over. " +
      "The estimate stays on file, marked Converted.</p>" +
    '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;' +
      'padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;font-size:14px">' +
      "<span>Invoice total</span><b class=" + '"num"' + ">" +
      Money.fmt(t.total, e.currency) + "</b></div>" +
    '<div class="grid2">' +
      '<label class="f"><span>Invoice number</span><input class="inp" id="vNum" value="' +
        attr(formatNumber(S.settings.invoicePrefix, S.settings.invoiceNext)) + '"></label>' +
      '<label class="f"><span>Issue date</span><input class="inp" id="vDate" type="date" value="' +
        todayISO() + '"></label>' +
    "</div>" +
    '<label class="chk"><input type="checkbox" id="vMarkAccepted" checked>' +
      "<span>Mark the estimate as accepted</span></label>",
    '<button class="btn" data-close>Cancel</button>' +
    '<button class="btn primary" id="vGo">Create invoice</button>');

  $("#vGo").onclick = () => {
    const num = $("#vNum").value.trim();
    if (!num) { toast("Invoice needs a number.", "err"); return; }
    if (S.docs.some((d) => d.type === "invoice" &&
        d.number.trim().toLowerCase() === num.toLowerCase())) {
      toast("Number " + num + " is already used.", "err"); return;
    }
    const issue = $("#vDate").value || todayISO();
    const inv = JSON.parse(JSON.stringify(e));
    inv.id = uid();
    inv.type = "invoice";
    inv.number = num;
    inv.issueDate = issue;
    inv.dueDate = addDays(issue, S.settings.paymentTermsDays);
    inv.status = "draft";
    inv.payments = [];
    inv.convertedFromId = e.id;
    inv.convertedToId = null;
    inv.items = inv.items.map((it) => Object.assign({}, it, { id: uid() }));
    inv.createdAt = inv.updatedAt = new Date().toISOString();
    S.docs.push(inv);
    S.settings.invoiceNext++;
    e.convertedToId = inv.id;
    if ($("#vMarkAccepted").checked) e.status = "accepted";
    e.updatedAt = new Date().toISOString();
    persist(true); closeModal(); go("#/doc/" + inv.id);
    toast("Invoice " + num + " created");
  };
}

function duplicateDoc(id) {
  const src = docById(id); if (!src) return;
  const isInv = src.type === "invoice";
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.number = formatNumber(isInv ? S.settings.invoicePrefix : S.settings.estimatePrefix,
    isInv ? S.settings.invoiceNext : S.settings.estimateNext);
  copy.issueDate = todayISO();
  copy.dueDate = addDays(todayISO(), isInv ? S.settings.paymentTermsDays : S.settings.estimateValidDays);
  copy.status = "draft";
  copy.payments = [];
  copy.convertedToId = null; copy.convertedFromId = null;
  copy.items = copy.items.map((it) => Object.assign({}, it, { id: uid() }));
  copy.createdAt = copy.updatedAt = new Date().toISOString();
  S.docs.push(copy);
  if (isInv) S.settings.invoiceNext++; else S.settings.estimateNext++;
  persist(true); go("#/doc/" + copy.id);
  toast("Duplicated as " + copy.number);
}

        '<label class="f"><span>Next number</span><input class="inp num" id="sEstNext" value="' +

/* ------------------------------------------------- settings · Your data */
function dataSize() {
  try { return JSON.stringify(S).length; } catch (e) { return 0; }
}
function dataStatusBlock() {
  const kb = Math.round(dataSize() / 1024);
  const last = S.settings.lastExport;
  const days = last ? daysBetween(last, todayISO()) : null;
  const stale = days === null || days > 14;
  const rows = [
    ["Saving to", esc(Store.label()) + (Store.fileHandle
      ? ' <span style="color:var(--ok)">· live file</span>'
      : ' <span style="color:var(--muted)">· this browser only</span>')],
    ["Stored", S.clients.length + " client" + (S.clients.length === 1 ? "" : "s") + " · " +
      S.docs.length + " document" + (S.docs.length === 1 ? "" : "s") + " · " + kb + " KB"],
    ["Last backup", last
      ? esc(fmtDate(last)) + (days > 0 ? ' <span style="color:' +
        (stale ? "var(--warn)" : "var(--muted)") + '">· ' + days + " days ago</span>" : "")
      : '<span style="color:var(--warn)">Never</span>']
  ];
  return '<div style="background:var(--surface-2);border:1px solid var(--border);' +
    'border-radius:8px;padding:12px 14px;margin-bottom:4px;font-size:12.5px">' +
    rows.map((r) => '<div style="display:flex;gap:12px;padding:3px 0">' +
      '<span style="color:var(--muted);flex:0 0 92px">' + esc(r[0]) + "</span>" +
      "<span>" + r[1] + "</span></div>").join("") +
    "</div>";
}

function autoBackupBlock() {
  const head = '<div class="dsec"><div class="dsec-t">Automatic backup</div>';
  if (Store.fileHandle) {
    return head + '<div class="dsec-b" style="color:var(--ok)">Already covered — every ' +
      "change is written straight to <b>" + esc(Store.fileName) + "</b> as you make it. " +
      "Nothing to set up here.</div></div>";
  }
  const on = S.settings.autoBackup === "daily";
  const last = S.settings.lastAutoBackup;
  return head +
    '<div class="dsec-b">Downloads a backup by itself the first time you save each day. ' +
    "One file per day, into your Downloads folder — worth tidying out now and then. " +
    "Your browser may ask permission the first time it fires.</div>" +
    '<label class="chk"><input type="checkbox" ' + (on ? "checked" : "") +
    ' onchange="setAutoBackup(this.checked)"><span>Back up once a day, automatically</span></label>' +
    (last ? '<div style="font-size:11.5px;color:var(--muted);margin-top:9px">' +
      "Last automatic backup: " + esc(fmtDate(last)) + "</div>" : "") +
    (on ? '<div style="font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5">' +
      "This is a safety net, not live saving. For a copy that updates with every single " +
      "change, use the live file below.</div>" : "") +
    "</div>";
}

function diskLinkBlock() {
  const sup = Store.fileSupport();
  const head = '<div class="dsec"><div class="dsec-t">Live copy on disk</div>';
  const err = Store.fileError
    ? '<div style="background:var(--danger-soft);border:1px solid ' +
      'color-mix(in srgb,var(--danger) 30%,transparent);color:var(--danger);border-radius:6px;' +
      'padding:8px 11px;margin-bottom:10px;font-size:12px;line-height:1.45">' +
      "<b>Last attempt failed:</b> " + esc(Store.fileError) + "</div>"
    : "";

  // already linked
  if (Store.fileHandle) {
    return head + err +
      '<div class="dsec-b">Every change writes straight to <b>' + esc(Store.fileName) +
      "</b>. Keep that file in Dropbox, iCloud or OneDrive and your data is backed up " +
      "continuously.</div>" +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" onclick="linkDiskFile()">Change file</button>' +
      '<button class="btn" onclick="openDiskFile()">Open a different file</button>' +
      '<button class="btn" onclick="unlinkDiskFile()">Unlink</button></div></div>';
  }

  // linked previously, needs permission again after a reload
  if (Store.pendingHandle) {
    return head + err +
      '<div class="dsec-b">You linked <b>' + esc(Store.pendingName) +
      "</b> before. Browsers drop file permission when the page reloads, so it needs " +
      "one click to reconnect.</div>" +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn primary" onclick="reconnectFile()">Reconnect to ' +
      esc(Store.pendingName) + "</button>" +
      '<button class="btn" onclick="unlinkDiskFile()">Forget it</button></div></div>';
  }

  // supported and available
  if (sup.ok) {
    return head + err +
      '<div class="dsec-b">Pick a .json file and every change writes straight to it — ' +
      "no exporting to remember. Put it in Dropbox or iCloud for automatic offsite " +
      "backup, and use <i>Open from disk</i> to pick it up on another machine.</div>" +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn primary" onclick="linkDiskFile()">Link a file on disk</button>' +
      '<button class="btn" onclick="openDiskFile()">Open from disk</button></div></div>';
  }

  // not available — say exactly why, and what to do instead
  const reasons = {
    "file-origin":
      "Not available when the app is opened by double-clicking the file. Browsers give " +
      "<code>file://</code> pages no origin, and refuse them direct disk access — a " +
      "security rule, not something the app can switch off.",
    browser:
      "Your browser doesn't support writing directly to a file. Chrome and Edge do; " +
      "Safari and Firefox don't.",
    insecure:
      "Only available on a secure page (https or localhost)."
  };
  return head + err +
    '<div class="dsec-b">' + reasons[sup.why] + "</div>" +
    '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;' +
    'padding:11px 13px;font-size:12.5px;line-height:1.55;color:var(--text-2)">' +
    "<b>Use Export backup instead.</b> It works everywhere and produces the same file." +
    (sup.why === "file-origin"
      ? "<br><br>If you want the live-file version, the app has to be served rather than " +
        "double-clicked. In a terminal, from the folder holding this file:" +
        '<br><code style="display:inline-block;margin-top:6px;background:var(--surface-3);' +
        'padding:4px 8px;border-radius:4px;font-size:12px">python3 -m http.server 8000</code>' +
        '<br>then open <code>http://localhost:8000/PullScrewInvoice.html</code>.'
      : "") +
    "</div></div>";
}

function saveSettings() {
  const co = S.company, b = co.bank, st = S.settings;
  const val = (id) => { const e = $("#" + id); return e ? e.value.trim() : ""; };
  const int = (id, def) => { const n = parseInt(val(id), 10); return isNaN(n) ? def : n; };

  co.name = val("sName"); co.addressLines = val("sAddr");
  co.email = val("sEmail"); co.phone = val("sPhone"); co.web = val("sWeb");
  co.taxIdLabel = val("sTaxLabel") || "TRN"; co.taxId = val("sTaxId");

  b.name = val("bName"); b.branch = val("bBranch"); b.accountName = val("bAccName");
  b.accountNumber = val("bAccNo"); b.accountType = val("bAccType");
  b.routing = val("bRouting"); b.swift = val("bSwift"); b.iban = val("bIban");
  b.instructions = val("bInstr");

  st.taxEnabled = $("#sTaxEnabled").checked;
  st.taxLabel = val("sTaxName") || "Tax";
  st.taxRateBp = Math.round(clamp(parseFloat(val("sTaxRate")) || 0, 0, 100) * 100);
  st.taxDefaultOn = $("#sTaxDefaultOn").checked;
  st.currency = $("#sCurrency").value;
  st.enabledCurrencies = $$(".curChk").filter((c) => c.checked).map((c) => c.value);
  if (!st.enabledCurrencies.length) st.enabledCurrencies = [st.currency];
  if (!st.enabledCurrencies.includes(st.currency)) st.enabledCurrencies.unshift(st.currency);

  st.invoicePrefix = val("sInvPre") || "INV-{####}";
  st.invoiceNext = Math.max(1, int("sInvNext", 1));
  st.estimatePrefix = val("sEstPre") || "EST-{####}";
  st.estimateNext = Math.max(1, int("sEstNext", 1));
  st.paymentTermsDays = clamp(int("sTerms", 30), 0, 365);
  st.estimateValidDays = clamp(int("sValid", 30), 0, 365);
  st.defaultNotes = val("sNotes"); st.defaultTerms = val("sTermsTxt");
  st.footerText = val("sFooter");
  st.pageSize = $("#sPage").value;

  persist(true); render(); toast("Settings saved");
}

/* ------------------------------------------------------------------ logo */
function pickLogo() { $("#logoFile").click(); }
function clearLogo() {
  S.company.logo = ""; persist(true); render(); toast("Logo removed");
}
function loadLogo(file) {
  if (!/^image\//.test(file.type)) { toast("Pick an image file.", "err"); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 600, maxH = 300;
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxW / w, maxH / h);
      w = Math.round(w * scale); h = Math.round(h * scale);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const cx = cv.getContext("2d");
      cx.imageSmoothingQuality = "high";
      cx.drawImage(img, 0, 0, w, h);
      // PNG keeps transparency; fall back to JPEG if the PNG is huge
      let out = cv.toDataURL("image/png");
      if (out.length > 300000) {
        const cv2 = document.createElement("canvas");
        cv2.width = w; cv2.height = h;
        const c2 = cv2.getContext("2d");
        c2.fillStyle = "#fff"; c2.fillRect(0, 0, w, h);
        c2.drawImage(img, 0, 0, w, h);
        out = cv2.toDataURL("image/jpeg", 0.86);
      }
      S.company.logo = out;
      persist(true); render();
      toast("Logo updated");
    };
    img.onerror = () => toast("Couldn't read that image.", "err");
    img.src = reader.result;
  };
  reader.onerror = () => toast("Couldn't read that file.", "err");
  reader.readAsDataURL(file);
}

/* ---------------------------------------------------------- import/export */
function backupFilename() {
  const slug = (S.company.name || "pullscrew").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "pullscrew";
  return slug + "-invoices-" + todayISO() + ".json";
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = backupFilename();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function exportData() {
  S.settings.lastExport = todayISO();
  persist(true);
  downloadBackup();
  render();
  toast("Backup downloaded");
}
function setAutoBackup(on) {
  S.settings.autoBackup = on ? "daily" : "off";
  persist(true); render();
  toast(on ? "Daily backup on — first save each day downloads a copy"
           : "Daily backup off");
}

function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let data;
      try { data = JSON.parse(r.result); }
      catch (e) { toast("That file isn't valid JSON.", "err"); return; }
      if (!data || !Array.isArray(data.docs) || !Array.isArray(data.clients)) {
        toast("That doesn't look like a PullScrew backup.", "err"); return;
      }
      confirmDlg("Replace all data?",
        "This backup holds <b>" + data.clients.length + " clients</b> and <b>" +
        data.docs.length + " documents</b>. It will replace everything currently stored " +
        "(" + S.clients.length + " clients, " + S.docs.length + " documents).",
        "Replace everything", () => {
          S = migrate(data);
          persist(true); go("#/dashboard"); render();
          toast("Backup restored");
        }, true);
    };
    r.readAsText(f);
  };
  inp.click();
}

async function linkDiskFile() {
  try {
    const name = await Store.linkFile(S);
    render(); toast("Now saving to " + name);
  } catch (e) {
    if (e && e.name === "AbortError") return;          // user closed the picker
    Store.fileError = (e && (e.message || e.name)) || "unknown error";
    render();
    toast("Couldn't link that file — see Your data for the reason.", "err");
  }
}

// A handle restored from IndexedDB usually comes back needing permission again,
// and requestPermission() only works inside a user gesture — hence the button.
async function reconnectFile() {
  const h = Store.pendingHandle;
  if (!h) return;
  try {
    const perm = await h.requestPermission({ mode: "readwrite" });
    if (perm !== "granted") { toast("Permission denied.", "err"); return; }
    Store.fileHandle = h; Store.fileName = h.name;
    Store.pendingHandle = null; Store.fileError = "";
    const txt = await (await h.getFile()).text();
    if (txt.trim()) S = migrate(JSON.parse(txt));
    persist(true); render();
    toast("Reconnected to " + h.name);
  } catch (e) {
    Store.fileError = (e && (e.message || e.name)) || "unknown error";
    render(); toast("Couldn't reconnect.", "err");
  }
}

async function unlinkDiskFile() {
  await Store.unlinkFile();
  render(); toast("Disk file unlinked — saving to this browser only");
}

async function openDiskFile() {
  try {
    const data = await Store.openFile();
    if (!data || !Array.isArray(data.docs)) { toast("That file isn't a PullScrew backup.", "err"); return; }
    confirmDlg("Load this file?",
      "It holds <b>" + (data.clients || []).length + " clients</b> and <b>" +
      data.docs.length + " documents</b>, and will replace what's stored here now. " +
      "Future changes save straight to that file.",
      "Load it", () => {
        S = migrate(data); persist(true); go("#/dashboard"); render();
        toast("Loaded from disk");
      }, true);
  } catch (e) {
    if (e && e.name === "AbortError") return;
    Store.fileError = (e && (e.message || e.name)) || "unknown error";
    render(); toast("Couldn't open that file — see Your data for the reason.", "err");
  }
}

function resetAll() {
  confirmDlg("Erase everything?",
    "All " + S.clients.length + " clients and " + S.docs.length +
    " documents will be deleted from this device. Export a backup first if you might want them back.",
    "Erase everything", () => {
      const keepFile = Store.fileHandle;
      S = blankState();
      Store.fileHandle = keepFile;
      persist(true); go("#/dashboard"); render();
      toast("Everything erased");
    }, true);
}

/* ------------------------------------------------------------------ theme */
function applyTheme() {
  const t = S.settings.theme || "system";
  const dark = t === "dark" || (t === "system" &&
    window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
$("#themeBtn").onclick = () => {
  const order = ["system", "light", "dark"];
  const i = order.indexOf(S.settings.theme || "system");
  S.settings.theme = order[(i + 1) % 3];
  persist(); applyTheme();
  toast("Theme: " + S.settings.theme);
};
if (window.matchMedia) {
  window.matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change", () => { if ((S.settings.theme || "system") === "system") applyTheme(); });
}

/* --------------------------------------------------------------- shortcuts */
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "s" && route.name === "edit") {
    e.preventDefault(); saveDraft(true);
  }
  if (mod && e.key.toLowerCase() === "p" && route.name === "view") {
    // let the browser handle it — the print stylesheet does the rest
  }
});

// warn before losing an unsaved draft on close
window.addEventListener("beforeunload", (e) => {
  if (draft && route.name === "edit") { e.preventDefault(); e.returnValue = ""; }
});

/* ------------------------------------------------------------------- boot */
(async function boot() {
  await Store.init();

  // If a disk file was linked before, it is the source of truth — read it back.
  // Permission usually needs re-granting after a reload, which requires a click,
  // so park the handle and let the Settings screen offer Reconnect.
  let loaded = null;
  if (Store.fileSupport().ok) {
    const h = await Store.loadHandle();
    if (h && typeof h.queryPermission === "function") {
      try {
        Store.pendingName = h.name || "the linked file";
        const perm = await h.queryPermission({ mode: "readwrite" });
        if (perm === "granted") {
          Store.fileHandle = h; Store.fileName = h.name;
          const txt = await (await h.getFile()).text();
          if (txt.trim()) loaded = JSON.parse(txt);
        } else {
          Store.pendingHandle = h;
        }
      } catch (e) {
        Store.pendingHandle = h;
        Store.fileError = (e && (e.message || e.name)) || "couldn't read the linked file";
      }
    }
  }

  if (!loaded) loaded = await Store.load();
  S = migrate(loaded);
  if (!loaded) {
    // seed sensible Jamaican defaults on very first run
    S.settings.taxLabel = "GCT";
    S.settings.taxRateBp = 1500;
    S.settings.currency = "JMD";
    S.company.taxIdLabel = "TRN";
    S.settings.defaultTerms = "Payment due within 30 days of the invoice date.";
    S.settings.defaultNotes = "Thank you for your business.";
  }
  route = parseHash();
  if (!location.hash) location.hash = "#/dashboard";
  render();
  if (!loaded) persist(true);
})();

// expose the handful of things inline handlers call
Object.assign(window, {
  go, setFilter, setSearch, clientDlg, renderKeepFocus, addItem, rmItem, upItem, autoGrow,
  setDiscountType, setDiscountValue, toggleTax, setTaxRate, setIssueDate, rmPayment,
  quickClient, cancelEdit, saveDraft, deleteDoc, payDlg, convertDlg, duplicateDoc,
  delPayment, saveSettings, pickLogo, clearLogo, exportData, importData, linkDiskFile,
  openDiskFile, resetAll, renderSoft, patchAmounts, reconnectFile, unlinkDiskFile,
  setAutoBackup, downloadBackup
});
